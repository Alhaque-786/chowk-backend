version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errorlint
    - gosec
    - makezero
    - misspell
    - nilerr
    - noctx
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*database/sql.Rows).Close
        # apperr's builders MUTATE THE RECEIVER and return it only so constructors
        # can be chained. Verified in shared/apperr: WithField writes into e.Fields
        # and returns e. Calling it as a statement is the intended usage at 53 call
        # sites, and errcheck cannot tell a fluent builder from an error return.
        - (*github.com/zevoxa/chowk-backend/internal/shared/apperr.Error).WithField
        - (*github.com/zevoxa/chowk-backend/internal/shared/apperr.Error).WithCause
    gosec:
      excludes:
        - G404
    govet:
      # fieldalignment is DELIBERATELY NOT ENABLED. It produced 147 findings — every
      # struct whose fields are not ordered largest-first — and the fix is reordering
      # fields for padding, which buys memory this service is nowhere near
      # constrained by.
      #
      # The comment it replaces said "matters for hot-path types", which is true and
      # is exactly what a repository-wide check cannot express. If a hot-path struct
      # ever needs it, `go vet -vettool` on that one package answers on demand.
      #
      # It was also never actually enforced: the exclusion below listed
      # `fieldalignment` under `linters`, but it is a govet CHECK rather than a
      # linter, so the exclusion matched nothing. Both halves only surfaced when CI
      # moved from the golangci-lint v1 binary to v2.
      enable: []
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files legitimately ignore errors in setup and use weaker randomness.
      # `fieldalignment` used to be listed here and matched nothing — it is a govet
      # check, not a linter name, so it was silently inert.
      - linters:
          - errcheck
          - gosec
          # httptest.NewRequest is the correct call in a test; noctx exists to catch
          # PRODUCTION HTTP clients built without a context, where the result is an
          # unbounded hang. All 15 findings were httptest in _test.go files.
          - noctx
          # Test helpers shadowing min/max/cap are local and obvious.
          - predeclared
          # Tests compare against sentinel errors directly on purpose: asserting the
          # exact value is stronger than errors.Is when the test OWNS the error.
          - errorlint
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
