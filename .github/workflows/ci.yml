name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on the same branch. Without this, pushing three times in
# a minute queues three full pipelines and the first two are already irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # Fast feedback first. Formatting and boundary violations are caught in ~30s,
  # so a developer is not waiting on a 5-minute test suite to learn they forgot
  # to run gofmt.
  quality:
    name: Format, vet, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The architectural rule is only real if CI enforces it. A human reviewer
      # will not reliably notice one convenience import, and that single import
      # is how a modular monolith becomes an untanglable ball of mud.
      - name: Check module boundaries
        run: make check-boundaries

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run: go mod tidy"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest

    # Real Postgres and Redis, not mocks. A repository test against a fake proves
    # the fake works; it proves nothing about whether the SQL is valid, whether
    # the constraint fires, or whether the index is used.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: cloudkitchen
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: cloudkitchen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudkitchen -d cloudkitchen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DSN: postgres://cloudkitchen:localdev@localhost:5432/cloudkitchen_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      JWT_SECRET: ci-test-secret-that-is-long-enough-to-pass-validation
      APP_ENV: local

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Migrations run as part of CI, which means a broken migration fails the
      # build rather than the deploy. Applied migrations are immutable, so this
      # also catches an edited one before it reaches an environment.
      - name: Apply migrations
        run: go run ./cmd/migrate

      # -race is mandatory, not optional. This codebase runs concurrent event
      # handlers, a shared circuit breaker, and cache singleflight; a data race
      # that only manifests under production load is the worst class of bug to
      # debug after the fact.
      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build but do not push. Confirms the Dockerfile works on every PR, so a
      # broken build is never discovered at deploy time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: chowk-api:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Checks dependencies against the Go vulnerability database. A CVE in a
      # transitive dependency is invisible without this.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
